{% extends "base.html" %}
{% block title %}Log in — Al-Quran{% endblock %}
{% block content %}<div class="mx-auto max-w-md rounded-3xl border border-stone-200 bg-white p-7 shadow-sm"><h1 class="text-2xl font-bold">Welcome back</h1><p class="mt-2 text-sm text-stone-500">Log in to access your saved verses.</p><form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="w-full rounded-xl bg-emerald-900 px-4 py-3 font-bold text-white">Log in</button></form><p class="mt-5 text-sm text-stone-500">New here? <a class="font-bold text-emerald-800" href="{% url 'register' %}">Create an account</a></p></div>{% endblock %}
